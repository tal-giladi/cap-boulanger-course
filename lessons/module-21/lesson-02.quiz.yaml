- id: q1
  question: >-
    A mill's product sheet reads: "Farine de blé — cendres 0,58 % de la matière sèche — humidité
    14,8 %." Which type is this flour?
  options:
    - >-
      T65, because a bread flour of this quality is always T65
    - >-
      T45, because the moisture is below 15 %
    - >-
      T55, because 0.58 % ash is within 0.50–0.60 %
    - >-
      T80, because the ash figure is close to 0.8 %
  correct: 2
  explanation: >-
    The type is the ash percentage on dry matter × 100, read against the ranges: T55 is 0.50–0.60 %.
    Moisture says how well the flour keeps, not its type.

- id: q2
  question: >-
    A tradition flour's sheet lists: "farine de blé, farine de fèves 2,5 %, farine de blé malté
    0,2 %". May it be used for pain de tradition française as it is?
  options:
    - >-
      No: bean flour 2.5 % is above the 2 % limit of the decree
    - >-
      Yes: bean flour and malt flour are both adjuvants allowed in tradition
    - >-
      No: malt flour is forbidden in pain de tradition française
    - >-
      Yes: the limits apply to the bread, not to the flour bought
  correct: 0
  explanation: >-
    Décret 93-1074, article 2, allows bean flour up to 2 %, soy 0.5 % and wheat malt 0.3 % of the
    flour. 2.5 % bean flour exceeds the limit; the malt at 0.2 % is fine.

- id: q3
  question: >-
    An améliorant label lists: "farine de blé, gluten, farine de fèves, acide ascorbique (E300),
    amylases fongiques". How should the ingredients be classified?
  options:
    - >-
      Additives: gluten and E300; adjuvants: bean flour and amylases
    - >-
      Additive: E300; adjuvants: gluten, bean flour; processing aid: amylases
    - >-
      Processing aids: E300 and amylases; adjuvants: gluten and bean flour
    - >-
      Additives: all of them except the wheat flour used as a carrier
  correct: 1
  explanation: >-
    Ascorbic acid is the additive; gluten and bean flour are adjuvants; fungal amylases are a
    processing aid inactivated in the oven. Because of E300, it may never go into tradition.

- id: q4
  question: >-
    A laboratory report on a bakery's campagne crumb gives pH 4.2 and 950 ppm acetic acid. The
    bread is made and baked on site. Which name may it carry?
  options:
    - >-
      "Pain de tradition française au levain", as levain bread qualifies
    - >-
      "Pain de campagne" only, as "au levain" needs pH below 4.0
    - >-
      "Pain de campagne au levain", with pH and acetic acid within the decree
    - >-
      None until the bread has been certified by a Label Rouge body
  correct: 2
  explanation: >-
    Au levain needs pH ≤ 4.3 and at least 900 ppm acetic acid: 4.2 and 950 qualify. A campagne
    with rye or other flours is not tradition, so that name is not available.

- id: q5
  question: >-
    A brioche formula needs 60 g fresh yeast; only instant dry yeast is in stock. Which quantity
    replaces it?
  options:
    - >-
      About 180 g, three times the fresh weight
    - >-
      About 60 g, the same weight as the fresh yeast
    - >-
      About 6 g, a tenth of the fresh weight
    - >-
      About 20 g, a third of the fresh weight
  correct: 3
  explanation: >-
    Instant dry yeast is roughly three times as concentrated: fresh × 0.33 ≈ 20 g. Multiplying by
    three is the classic slip.
