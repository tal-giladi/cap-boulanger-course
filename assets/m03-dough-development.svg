<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-labelledby="t d">
  <title id="t">Dough development during mixing: from frasage to optimum, then over-mixing</title>
  <desc id="d">A curve of gluten development against mixing time. It rises during frasage and development, reaches a plateau at the optimum where the dough passes the windowpane test, then falls during letdown and breakdown when the dough is over-mixed. A dashed line shows dough temperature rising steadily the whole time. Under the graph, the windowpane test at each stage: tears at once, tears after a short stretch, thin translucent film, then a sticky film that flows and tears.</desc>
  <rect x="0" y="0" width="900" height="520" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#444444"/>
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif" fill="#222222">
    <text x="450" y="30" text-anchor="middle" font-size="21" font-weight="bold">Dough development: under-mixed, optimum, over-mixed</text>

    <!-- stage bands -->
    <rect x="90" y="55" width="140" height="285" fill="#eef5fb"/>
    <rect x="230" y="55" width="210" height="285" fill="#f4f9ee"/>
    <rect x="440" y="55" width="170" height="285" fill="#e3f2d9"/>
    <rect x="610" y="55" width="130" height="285" fill="#fdf1e6"/>
    <rect x="740" y="55" width="130" height="285" fill="#fbe3e0"/>
    <g font-size="14" font-weight="bold" text-anchor="middle">
      <text x="160" y="75">Frasage</text>
      <text x="335" y="75">Development</text>
      <text x="525" y="75">Optimum</text>
      <text x="675" y="75">Letdown</text>
      <text x="805" y="75">Breakdown</text>
    </g>
    <g font-size="12" text-anchor="middle">
      <text x="160" y="93">mix, hydrate</text>
      <text x="335" y="93">étirage, soufflage</text>
      <text x="525" y="93">stop here</text>
      <text x="675" y="93">over-mixed</text>
      <text x="805" y="93">unusable</text>
    </g>

    <!-- axes -->
    <line x1="90" y1="340" x2="880" y2="340" stroke="#444444" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="90" y1="340" x2="90" y2="50" stroke="#444444" stroke-width="2" marker-end="url(#ar)"/>
    <text x="870" y="362" text-anchor="end" font-size="13">mixing time →</text>
    <text x="30" y="200" font-size="13" transform="rotate(-90 30 200)" text-anchor="middle">gluten development / strength</text>

    <!-- development curve -->
    <path d="M 95 320 C 170 315, 200 290, 250 240 S 380 130, 450 128 L 600 126 C 640 130, 670 170, 700 215 S 790 300, 870 318" fill="none" stroke="#2f6b2f" stroke-width="4"/>
    <!-- temperature dashed -->
    <path d="M 95 300 L 870 120" fill="none" stroke="#c0402a" stroke-width="2.5" stroke-dasharray="8 6"/>
    <text x="300" y="242" font-size="13" fill="#c0402a" font-weight="bold" transform="rotate(-13 300 242)">dough temperature keeps rising (friction)</text>
    <text x="520" y="118" text-anchor="middle" font-size="13" fill="#2f6b2f" font-weight="bold">smooth, elastic, holds gas</text>

    <!-- windowpane icons -->
    <g font-size="12" text-anchor="middle">
      <!-- 1 -->
      <rect x="105" y="385" width="110" height="70" rx="8" fill="#f5f5f5" stroke="#777777"/>
      <path d="M 125 420 L 145 405 L 150 425 L 170 400 L 178 428 L 195 410" fill="none" stroke="#8a6a10" stroke-width="3"/>
      <text x="160" y="475">tears at once,</text>
      <text x="160" y="491">rough, sticky</text>
      <!-- 2 -->
      <rect x="280" y="385" width="110" height="70" rx="8" fill="#f5f5f5" stroke="#777777"/>
      <ellipse cx="335" cy="420" rx="38" ry="22" fill="#e9dcb4" stroke="#8a6a10" stroke-width="2"/>
      <path d="M 320 415 L 335 425 L 350 412" fill="none" stroke="#8a6a10" stroke-width="3"/>
      <text x="335" y="475">stretches a little,</text>
      <text x="335" y="491">thick, then tears</text>
      <!-- 3 -->
      <rect x="470" y="385" width="110" height="70" rx="8" fill="#f5f5f5" stroke="#2f6b2f" stroke-width="2"/>
      <ellipse cx="525" cy="420" rx="42" ry="26" fill="#fbf6e6" stroke="#2f6b2f" stroke-width="2"/>
      <text x="525" y="424" fill="#2f6b2f">light shows</text>
      <text x="525" y="475">thin, even film;</text>
      <text x="525" y="491">windowpane passed</text>
      <!-- 4 -->
      <rect x="650" y="385" width="190" height="70" rx="8" fill="#f5f5f5" stroke="#777777"/>
      <path d="M 680 405 C 700 440, 720 400, 745 440 S 790 400, 810 440" fill="none" stroke="#c0402a" stroke-width="3"/>
      <text x="745" y="475">sticky, warm, slack; film flows</text>
      <text x="745" y="491">and tears; crumb very white</text>
    </g>
  </g>
</svg>
