<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="t d">
  <title id="t">Who you report to in a craft bakery, and how fast</title>
  <desc id="d">A reporting chain. On the left, the ouvrier boulanger or apprentice finds a problem. Three kinds of problem are shown with their timing. A delivery problem is reported at once, before the driver leaves, with the reservation written on the delivery note. A machine malfunction or danger: stop the machine, tag it out of order and alert the chef immediately. A product non-conformity is reported before the product reaches the shop. All three go to the chef boulanger, the head of production, who decides or passes the matter to the chef d'entreprise, the owner, who deals with the supplier, the technician or the authorities. Across the bottom, a two-way link between the fournil and the sales staff: the hand-over brief goes to the shop, and customer feedback and questions come back. The rule in the centre: facts and figures, what you did, what you propose, then the manager decides; written on the non-conformity report.</desc>
  <rect x="0" y="0" width="960" height="600" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif" fill="#222222">
    <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="bold">Rendre compte: who you report to, and how fast</text>

    <!-- finder -->
    <rect x="20" y="200" width="180" height="110" rx="10" fill="#e8eef7" stroke="#3b5b8c" stroke-width="2"/>
    <text x="110" y="232" text-anchor="middle" font-size="16" font-weight="bold">Ouvrier boulanger</text>
    <text x="110" y="254" text-anchor="middle" font-size="16" font-weight="bold">or apprenti</text>
    <text x="110" y="282" text-anchor="middle" font-size="14">finds the problem</text>

    <!-- three problem types -->
    <rect x="250" y="70" width="270" height="110" rx="8" fill="#fff4e0" stroke="#c07a00" stroke-width="2"/>
    <text x="385" y="96" text-anchor="middle" font-size="16" font-weight="bold">Delivery (C4.1)</text>
    <text x="385" y="120" text-anchor="middle" font-size="14">at once, before the driver leaves;</text>
    <text x="385" y="140" text-anchor="middle" font-size="14">reservation written on the</text>
    <text x="385" y="160" text-anchor="middle" font-size="14">bon de livraison</text>

    <rect x="250" y="200" width="270" height="110" rx="8" fill="#fde8e8" stroke="#b03030" stroke-width="2"/>
    <text x="385" y="226" text-anchor="middle" font-size="16" font-weight="bold">Machine fault or danger (C4.4)</text>
    <text x="385" y="250" text-anchor="middle" font-size="14">stop it, tag "hors service",</text>
    <text x="385" y="270" text-anchor="middle" font-size="14">alert immediately;</text>
    <text x="385" y="290" text-anchor="middle" font-size="14">never repair it yourself</text>

    <rect x="250" y="330" width="270" height="110" rx="8" fill="#e9f5ea" stroke="#2e7d4f" stroke-width="2"/>
    <text x="385" y="356" text-anchor="middle" font-size="16" font-weight="bold">Product non-conformity (C4.4)</text>
    <text x="385" y="380" text-anchor="middle" font-size="14">set it aside, count it,</text>
    <text x="385" y="400" text-anchor="middle" font-size="14">report before it reaches</text>
    <text x="385" y="420" text-anchor="middle" font-size="14">the shop</text>

    <line x1="200" y1="240" x2="248" y2="130" stroke="#444444" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="200" y1="255" x2="248" y2="255" stroke="#444444" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="200" y1="270" x2="248" y2="380" stroke="#444444" stroke-width="2" marker-end="url(#ar)"/>

    <!-- chef boulanger -->
    <rect x="575" y="200" width="170" height="110" rx="10" fill="#e8eef7" stroke="#3b5b8c" stroke-width="2"/>
    <text x="660" y="232" text-anchor="middle" font-size="16" font-weight="bold">Chef boulanger</text>
    <text x="660" y="254" text-anchor="middle" font-size="14">head of production:</text>
    <text x="660" y="276" text-anchor="middle" font-size="13">decides, or passes it up</text>

    <line x1="520" y1="125" x2="573" y2="235" stroke="#444444" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="520" y1="255" x2="573" y2="255" stroke="#444444" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="520" y1="385" x2="573" y2="280" stroke="#444444" stroke-width="2" marker-end="url(#ar)"/>

    <!-- owner -->
    <rect x="790" y="200" width="150" height="110" rx="10" fill="#e8eef7" stroke="#3b5b8c" stroke-width="2"/>
    <text x="865" y="232" text-anchor="middle" font-size="16" font-weight="bold">Chef</text>
    <text x="865" y="252" text-anchor="middle" font-size="16" font-weight="bold">d'entreprise</text>
    <text x="865" y="276" text-anchor="middle" font-size="13">supplier, technician,</text>
    <text x="865" y="294" text-anchor="middle" font-size="13">authorities</text>
    <line x1="745" y1="255" x2="788" y2="255" stroke="#444444" stroke-width="2" marker-end="url(#ar)"/>

    <!-- rule box -->
    <rect x="575" y="70" width="365" height="110" rx="8" fill="#f4f4f4" stroke="#777777" stroke-width="1.5"/>
    <text x="757" y="96" text-anchor="middle" font-size="15" font-weight="bold">Every report, spoken or written</text>
    <text x="757" y="120" text-anchor="middle" font-size="14">1 facts and figures  2 what you did</text>
    <text x="757" y="142" text-anchor="middle" font-size="14">3 what you propose  4 the manager decides</text>
    <text x="757" y="164" text-anchor="middle" font-size="14">then the non-conformity report in writing</text>

    <!-- sales link -->
    <rect x="575" y="400" width="365" height="90" rx="10" fill="#f3ecf9" stroke="#6b4a8c" stroke-width="2"/>
    <text x="757" y="430" text-anchor="middle" font-size="16" font-weight="bold">Personnel de vente (shop)</text>
    <text x="757" y="454" text-anchor="middle" font-size="14">serves customers with what the fournil</text>
    <text x="757" y="474" text-anchor="middle" font-size="14">tells them: never guesses</text>
    <line x1="640" y1="312" x2="640" y2="398" stroke="#6b4a8c" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="690" y1="398" x2="690" y2="312" stroke="#6b4a8c" stroke-width="2" marker-end="url(#ar)"/>
    <text x="700" y="346" font-size="13">down: hand-over brief (C4.2)</text>
    <text x="700" y="368" font-size="13">up: questions, feedback</text>

    <text x="480" y="560" text-anchor="middle" font-size="14" fill="#444444">Report up the line you work in; the person who can decide must hear it before the problem spreads.</text>
  </g>
</svg>
