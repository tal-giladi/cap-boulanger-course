<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d">
  <title id="t">Three bakery mixers seen from above and from the side: spiral, oblique-axis and planetary</title>
  <desc id="d">Left, the spiral mixer (pétrin à spirale): the bowl turns and a spiral hook turns on a vertical axis beside a fixed breaker bar; two speeds; fast development and the most friction heat; the usual bread mixer. Middle, the oblique-axis mixer (pétrin à axe oblique): a fork on a tilted axis lifts and folds the dough while the bowl is turned by the dough itself; slow, gentle, little heat and oxidation; long mixing times. Right, the planetary mixer (batteur): the tool spins on its own axis and at the same time travels round the fixed bowl like a planet round the sun; whisk, paddle or hook; brioche, creams, small batches. The home stand mixer is a small planetary mixer.</desc>
  <rect x="0" y="0" width="900" height="470" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b5442c"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2c6fb5"/>
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif" fill="#222222">
    <text x="450" y="32" text-anchor="middle" font-size="21" font-weight="bold">Three mixers, three ways of working the dough</text>
    <text x="450" y="56" text-anchor="middle" font-size="13">Top view: red arrows = the tool, blue arrows = the bowl</text>

    <!-- Panel 1: spiral -->
    <rect x="20" y="72" width="270" height="380" rx="10" fill="#f7f3ec" stroke="#c9b99a"/>
    <text x="155" y="98" text-anchor="middle" font-size="16" font-weight="bold">Pétrin à spirale</text>
    <text x="155" y="116" text-anchor="middle" font-size="13">spiral mixer</text>
    <circle cx="155" cy="205" r="72" fill="#efe2c8" stroke="#8a6d3b" stroke-width="3"/>
    <path d="M 210 150 A 78 78 0 0 1 228 225" fill="none" stroke="#2c6fb5" stroke-width="3" marker-end="url(#ab)"/>
    <path d="M 100 260 A 78 78 0 0 1 82 185" fill="none" stroke="#2c6fb5" stroke-width="3" marker-end="url(#ab)"/>
    <circle cx="185" cy="190" r="16" fill="#cfcfcf" stroke="#555555" stroke-width="2"/>
    <path d="M 205 180 A 22 22 0 1 1 196 170" fill="none" stroke="#b5442c" stroke-width="3" marker-end="url(#ar)"/>
    <rect x="148" y="198" width="10" height="10" fill="#555555"/>
    <text x="153" y="232" text-anchor="middle" font-size="11">breaker bar</text>
    <text x="196" y="160" text-anchor="middle" font-size="11">hook</text>
    <g font-size="13">
      <text x="34" y="306">• Bowl and spiral hook both turn</text>
      <text x="34" y="328">• 1st speed (frasage), 2nd speed</text>
      <text x="34" y="350">• Fast development, most friction</text>
      <text x="42" y="368">heat (improved mix: about 4-7 °C)</text>
      <text x="34" y="390">• Lean bread doughs: the usual</text>
      <text x="42" y="408">bread mixer</text>
      <text x="34" y="430">• Needs a minimum load to work</text>
    </g>

    <!-- Panel 2: oblique -->
    <rect x="315" y="72" width="270" height="380" rx="10" fill="#f7f3ec" stroke="#c9b99a"/>
    <text x="450" y="98" text-anchor="middle" font-size="16" font-weight="bold">Pétrin à axe oblique</text>
    <text x="450" y="116" text-anchor="middle" font-size="13">oblique-axis (fork) mixer, side view</text>
    <path d="M 385 170 L 395 270 Q 450 290 505 270 L 515 170 Z" fill="#efe2c8" stroke="#8a6d3b" stroke-width="3"/>
    <line x1="400" y1="135" x2="470" y2="255" stroke="#555555" stroke-width="6"/>
    <path d="M 470 255 Q 490 240 480 215" fill="none" stroke="#555555" stroke-width="6"/>
    <path d="M 420 140 A 30 18 -30 1 1 380 160" fill="none" stroke="#b5442c" stroke-width="3" marker-end="url(#ar)"/>
    <path d="M 400 292 Q 450 310 500 292" fill="none" stroke="#2c6fb5" stroke-width="3" marker-end="url(#ab)"/>
    <text x="530" y="200" font-size="11">fork</text>
    <text x="450" y="322" text-anchor="middle" font-size="11">bowl turned by the dough</text>
    <g font-size="13">
      <text x="329" y="348">• Fork on a tilted axis lifts and</text>
      <text x="337" y="366">folds; the bowl turns freely</text>
      <text x="329" y="388">• Slow and gentle: little heat,</text>
      <text x="337" y="406">little oxidation, long mixing</text>
      <text x="329" y="428">• Tradition, levain, soft doughs</text>
    </g>

    <!-- Panel 3: planetary -->
    <rect x="610" y="72" width="270" height="380" rx="10" fill="#f7f3ec" stroke="#c9b99a"/>
    <text x="745" y="98" text-anchor="middle" font-size="16" font-weight="bold">Batteur (mélangeur)</text>
    <text x="745" y="116" text-anchor="middle" font-size="13">planetary mixer</text>
    <circle cx="745" cy="205" r="72" fill="#efe2c8" stroke="#8a6d3b" stroke-width="3"/>
    <circle cx="745" cy="205" r="44" fill="none" stroke="#b5442c" stroke-width="2" stroke-dasharray="6 5"/>
    <path d="M 788 195 A 44 44 0 0 1 760 247" fill="none" stroke="#b5442c" stroke-width="3" marker-end="url(#ar)"/>
    <circle cx="745" cy="161" r="15" fill="#cfcfcf" stroke="#555555" stroke-width="2"/>
    <path d="M 732 150 A 18 18 0 1 0 757 150" fill="none" stroke="#b5442c" stroke-width="2.5" marker-end="url(#ar)"/>
    <text x="745" y="210" text-anchor="middle" font-size="11">bowl fixed</text>
    <g font-size="13">
      <text x="624" y="306">• Tool spins and travels round</text>
      <text x="632" y="324">the fixed bowl (planet and sun)</text>
      <text x="624" y="346">• Whisk, paddle (feuille), hook</text>
      <text x="624" y="368">• Brioche, creams, beaten mixes,</text>
      <text x="632" y="386">small batches</text>
      <text x="624" y="408">• The home stand mixer is a</text>
      <text x="632" y="426">small planetary mixer</text>
    </g>
  </g>
</svg>
