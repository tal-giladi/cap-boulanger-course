<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-labelledby="t d">
  <title id="t">From one lamination: croissant triangles and pain au chocolat rectangles</title>
  <desc id="d">Top left: a sheet rolled to about 3.5 millimetres and cut into long triangles for croissants. Top right: a sheet rolled to about 4 millimetres and cut into rectangles of about 8.5 by 15 centimetres for pains au chocolat. Bottom: rolling a pain au chocolat in three steps seen from the side: first baton about 1 to 1.5 centimetres from the near edge with the dough folded over it; second baton placed against the fold; rolled to the far edge so the seam ends underneath in the middle. Bottom right: the cut section showing two chocolate eyes inside a spiral of layers.</desc>
  <rect x="0" y="0" width="900" height="600" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#222222">
    <text x="450" y="32" text-anchor="middle" font-size="21" font-weight="bold">One lamination, two finishes</text>

    <!-- croissant sheet -->
    <text x="40" y="70" font-size="15" font-weight="bold">Croissant: sheet about 3.5 mm, triangles</text>
    <rect x="40" y="85" width="380" height="150" fill="#f1e2bd" stroke="#a8874a" stroke-width="2"/>
    <g stroke="#7a5a2a" stroke-width="1.5" fill="none">
      <path d="M 40 235 L 80 85 L 120 235"/>
      <path d="M 120 235 L 160 85 L 200 235"/>
      <path d="M 200 235 L 240 85 L 280 235"/>
      <path d="M 280 235 L 320 85 L 360 235"/>
      <path d="M 360 235 L 400 85 L 420 160"/>
      <path d="M 80 85 L 160 85 M 160 85 L 240 85"/>
    </g>
    <text x="40" y="258" font-size="12">stretched, then rolled from the wide base (lesson 11.5)</text>

    <!-- pain au chocolat sheet -->
    <text x="480" y="70" font-size="15" font-weight="bold">Pain au chocolat: about 4 mm, rectangles</text>
    <rect x="480" y="85" width="380" height="150" fill="#ead7a8" stroke="#a8874a" stroke-width="2"/>
    <g stroke="#7a5a2a" stroke-width="1.5">
      <line x1="480" y1="160" x2="860" y2="160"/>
      <line x1="543" y1="85" x2="543" y2="235"/>
      <line x1="606" y1="85" x2="606" y2="235"/>
      <line x1="669" y1="85" x2="669" y2="235"/>
      <line x1="732" y1="85" x2="732" y2="235"/>
      <line x1="795" y1="85" x2="795" y2="235"/>
    </g>
    <rect x="482" y="87" width="59" height="71" fill="none" stroke="#c0392b" stroke-width="2.5"/>
    <text x="512" y="122" text-anchor="middle" font-size="11" fill="#c0392b">8.5 cm</text>
    <text x="512" y="138" text-anchor="middle" font-size="11" fill="#c0392b">× 15 cm</text>
    <text x="480" y="258" font-size="12">not stretched; about 58-60 g of dough each; rest the sheet before cutting</text>

    <!-- rolling steps -->
    <text x="40" y="310" font-size="15" font-weight="bold">Rolling around two batons (side view)</text>

    <text x="40" y="345" font-size="13" font-weight="bold">1. First baton, fold over</text>
    <rect x="40" y="420" width="220" height="12" fill="#ead7a8" stroke="#a8874a" stroke-width="1.5"/>
    <rect x="58" y="404" width="14" height="10" fill="#5a3214"/>
    <path d="M 40 432 Q 30 400 60 396 Q 90 394 92 414" fill="none" stroke="#a8874a" stroke-width="10" stroke-linecap="round"/>
    <text x="40" y="455" font-size="11">baton 1-1.5 cm from the near edge</text>

    <text x="320" y="345" font-size="13" font-weight="bold">2. Second baton against the fold</text>
    <rect x="320" y="420" width="220" height="12" fill="#ead7a8" stroke="#a8874a" stroke-width="1.5"/>
    <path d="M 320 432 Q 310 400 340 396 Q 370 394 372 414" fill="none" stroke="#a8874a" stroke-width="10" stroke-linecap="round"/>
    <rect x="338" y="404" width="14" height="10" fill="#5a3214"/>
    <rect x="382" y="406" width="14" height="10" fill="#5a3214"/>
    <text x="320" y="455" font-size="11">no pulling: the width must stay</text>
    <text x="320" y="470" font-size="11">longer than the batons</text>

    <text x="600" y="345" font-size="13" font-weight="bold">3. Roll on, seam underneath</text>
    <ellipse cx="690" cy="410" rx="70" ry="34" fill="#ead7a8" stroke="#a8874a" stroke-width="2"/>
    <path d="M 640 410 Q 650 385 690 384 Q 735 386 740 410 Q 735 432 690 434 Q 650 432 646 412" fill="none" stroke="#a8874a" stroke-width="1.5"/>
    <rect x="660" y="403" width="16" height="11" fill="#5a3214"/>
    <rect x="704" y="403" width="16" height="11" fill="#5a3214"/>
    <line x1="682" y1="444" x2="698" y2="444" stroke="#c0392b" stroke-width="4"/>
    <text x="690" y="470" text-anchor="middle" font-size="11" fill="#c0392b">seam underneath, in the middle</text>

    <!-- section -->
    <text x="40" y="520" font-size="13" font-weight="bold">Cut section after baking:</text>
    <text x="40" y="540" font-size="12">two chocolate "eyes" fully enclosed in a spiral of thin, separate layers;</text>
    <text x="40" y="558" font-size="12">no greasy grey band, no hollow under the top, seam still underneath.</text>
    <ellipse cx="720" cy="540" rx="80" ry="38" fill="#e3b866" stroke="#a8874a" stroke-width="2"/>
    <ellipse cx="720" cy="540" rx="62" ry="27" fill="none" stroke="#c99a45" stroke-width="1.5"/>
    <ellipse cx="720" cy="540" rx="44" ry="17" fill="none" stroke="#c99a45" stroke-width="1.5"/>
    <rect x="688" y="534" width="16" height="11" fill="#5a3214"/>
    <rect x="736" y="534" width="16" height="11" fill="#5a3214"/>
  </g>
</svg>
