<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440" role="img" aria-labelledby="t d">
  <title id="t">How gluten forms: gliadin plus glutenin plus water plus work gives a network that holds gas</title>
  <desc id="d">Left: gliadins are small coiled proteins that make dough extensible. Glutenins are long chains that make dough elastic. Middle: water and mixing link them into gluten. Right: the gluten network is a film around starch granules that traps carbon dioxide bubbles made by yeast.</desc>
  <rect x="0" y="0" width="860" height="440" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#444444"/>
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif" fill="#222222">
    <text x="430" y="32" text-anchor="middle" font-size="22" font-weight="bold">Gluten: two proteins + water + work = a gas-holding network</text>

    <!-- gliadin box -->
    <rect x="20" y="60" width="230" height="140" rx="10" fill="#eef5fb" stroke="#4a7fb0"/>
    <text x="135" y="85" text-anchor="middle" font-size="17" font-weight="bold">Gliadins (gliadines)</text>
    <g fill="none" stroke="#4a7fb0" stroke-width="3">
      <circle cx="70" cy="125" r="14"/><circle cx="120" cy="120" r="12"/><circle cx="170" cy="128" r="14"/><circle cx="210" cy="118" r="10"/>
    </g>
    <text x="135" y="165" text-anchor="middle" font-size="14">small, coiled</text>
    <text x="135" y="185" text-anchor="middle" font-size="14" font-weight="bold">→ extensibility (stretch, flow)</text>

    <!-- glutenin box -->
    <rect x="20" y="220" width="230" height="140" rx="10" fill="#fdf1e6" stroke="#c0702a"/>
    <text x="135" y="245" text-anchor="middle" font-size="17" font-weight="bold">Glutenins (gluténines)</text>
    <g fill="none" stroke="#c0702a" stroke-width="3">
      <path d="M 40 275 Q 70 255 100 275 T 160 275 T 220 275"/>
      <path d="M 40 295 Q 70 315 100 295 T 160 295 T 220 295"/>
    </g>
    <text x="135" y="325" text-anchor="middle" font-size="14">long chains, linked end to end</text>
    <text x="135" y="345" text-anchor="middle" font-size="14" font-weight="bold">→ elasticity (springs back)</text>

    <!-- plus water + work -->
    <line x1="260" y1="210" x2="330" y2="210" stroke="#444444" stroke-width="3" marker-end="url(#ar)"/>
    <rect x="335" y="150" width="150" height="120" rx="10" fill="#f5f5f5" stroke="#777777"/>
    <text x="410" y="182" text-anchor="middle" font-size="16" font-weight="bold">+ water</text>
    <text x="410" y="204" text-anchor="middle" font-size="13">(hydration)</text>
    <text x="410" y="232" text-anchor="middle" font-size="16" font-weight="bold">+ work</text>
    <text x="410" y="254" text-anchor="middle" font-size="13">(mixing, folds, time)</text>
    <line x1="490" y1="210" x2="545" y2="210" stroke="#444444" stroke-width="3" marker-end="url(#ar)"/>

    <!-- network -->
    <rect x="550" y="60" width="290" height="300" rx="10" fill="#fffaf0" stroke="#8a6a10"/>
    <text x="695" y="85" text-anchor="middle" font-size="17" font-weight="bold">Gluten network</text>
    <!-- gas bubbles -->
    <g fill="#ffffff" stroke="#8a6a10" stroke-width="3">
      <ellipse cx="620" cy="150" rx="35" ry="28"/>
      <ellipse cx="730" cy="140" rx="45" ry="32"/>
      <ellipse cx="660" cy="240" rx="40" ry="33"/>
      <ellipse cx="775" cy="250" rx="35" ry="30"/>
    </g>
    <g font-size="12" text-anchor="middle" fill="#8a6a10">
      <text x="620" y="155">CO₂</text><text x="730" y="145">CO₂</text><text x="660" y="245">CO₂</text><text x="775" y="255">CO₂</text>
    </g>
    <!-- starch granules -->
    <g fill="#e9dcb4">
      <circle cx="580" cy="200" r="6"/><circle cx="700" cy="195" r="7"/><circle cx="720" cy="300" r="6"/>
      <circle cx="600" cy="300" r="7"/><circle cx="810" cy="190" r="6"/><circle cx="680" cy="110" r="5"/>
      <circle cx="790" cy="320" r="5"/><circle cx="640" cy="320" r="5"/>
    </g>
    <text x="695" y="345" text-anchor="middle" font-size="13">thin protein films hold gas; starch fills the gaps</text>

    <!-- bottom notes -->
    <g font-size="14">
      <text x="20" y="392" font-weight="bold">Elasticity vs extensibility:</text>
      <text x="215" y="392">the balance decides shaping and volume (the alveograph's P/L).</text>
      <text x="20" y="416">Salt and ascorbic acid tighten it; bran, much fat or sugar and long rests make it weaker or more extensible.</text>
    </g>
  </g>
</svg>
