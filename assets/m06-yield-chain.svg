<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">From flour to bread: where the weight goes</title>
  <desc id="d">Bar chart following 1000 g of flour made into PD-01 dough. The flour gives 1683 g of dough. About 2 percent, 34 g, stays in the bowl, on the tools and as scraps, leaving 1649 g of dough divided into pieces. In baking and cooling a baguette loses about 20 percent of its weight as water vapour, 330 g, leaving about 1319 g of bread. Yield is 1319 divided by 1649, about 80 percent of the divided dough, or about 132 kg of bread per 100 kg of flour. Formulas: process loss percent equals dough lost divided by dough made times 100; baking loss percent equals dough piece minus bread, divided by dough piece, times 100; dough piece weight equals target bread weight divided by one minus the baking loss.</desc>
  <rect x="0" y="0" width="900" height="470" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">From flour to bread: where the weight goes (PD-01, 1 kg of flour)</text>

  <!-- scale: 1000 g = 170 px, baseline y=330 -->
  <line x1="30" y1="330" x2="870" y2="330" stroke="#111827" stroke-width="1.5"/>
  <g font-size="14" fill="#111827" text-anchor="middle">
    <rect x="60" y="160" width="100" height="170" fill="#e8c27a" stroke="#7a5a12"/>
    <text x="110" y="350" font-weight="bold">Flour</text>
    <text x="110" y="368">1000 g</text>

    <rect x="250" y="44" width="100" height="286" fill="#f3f4f6" stroke="#6b7280"/>
    <text x="300" y="350" font-weight="bold">Dough made</text>
    <text x="300" y="368">1683 g (168.3 %)</text>

    <rect x="470" y="50" width="100" height="280" fill="#d1d5db" stroke="#374151"/>
    <text x="520" y="350" font-weight="bold">Dough divided</text>
    <text x="520" y="368">1649 g</text>

    <rect x="690" y="106" width="100" height="224" fill="#c08457" stroke="#6b3e1f"/>
    <text x="740" y="350" font-weight="bold">Bread, cooled</text>
    <text x="740" y="368">about 1319 g</text>
  </g>

  <!-- gains and losses between bars -->
  <g font-size="13" fill="#111827" text-anchor="middle">
    <text x="205" y="210">+ water,</text>
    <text x="205" y="226">salt, yeast</text>
  </g>
  <g stroke="#111827" stroke-width="2" fill="none">
    <path d="M172 240 L238 240"/>
    <path d="M230 234 L238 240 L230 246"/>
  </g>
  <g font-size="13" fill="#b91c1c" text-anchor="middle">
    <text x="410" y="110">process loss</text>
    <text x="410" y="128">−2 % = −34 g</text>
    <text x="410" y="146">bowl, scraps</text>
    <text x="630" y="170">baking loss</text>
    <text x="630" y="188">−20 % = −330 g</text>
    <text x="630" y="206">water vapour</text>
  </g>
  <g stroke="#b91c1c" stroke-width="2" fill="none">
    <path d="M362 165 L458 165"/>
    <path d="M450 159 L458 165 L450 171"/>
    <path d="M582 225 L678 225"/>
    <path d="M670 219 L678 225 L670 231"/>
  </g>

  <!-- formula boxes -->
  <rect x="30" y="390" width="410" height="70" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
  <g font-size="13" fill="#111827">
    <text x="45" y="412" font-weight="bold">Losses</text>
    <text x="45" y="430">process loss % = dough lost ÷ dough made × 100</text>
    <text x="45" y="448">baking loss % = (pâton − bread) ÷ pâton × 100</text>
  </g>
  <rect x="460" y="390" width="410" height="70" rx="8" fill="#fef3c7" stroke="#92400e"/>
  <g font-size="13" fill="#111827">
    <text x="475" y="412" font-weight="bold">Yield and back again</text>
    <text x="475" y="430">yield % = bread ÷ dough × 100 (here 80 %)</text>
    <text x="475" y="448">pâton = bread wanted ÷ (1 − baking loss)</text>
  </g>
</svg>
