<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="Helvetica, Arial, sans-serif">
  <title>Scoring a baguette: cut pattern and blade angle</title>
  <desc>Top: a baguette seen from above with five cuts close to the centre line, almost parallel to it, each overlapping the previous one by about a third. Bottom left: cross-section with the blade held flat at about 30 degrees, cutting about 5 millimetres under the skin, which lifts a flap that becomes the ear (grigne). Bottom right: blade held upright at 90 degrees, which opens a symmetrical cut without an ear, used for boules and decorative cuts.</desc>
  <rect x="0" y="0" width="900" height="430" fill="#ffffff"/>
  <text x="450" y="28" font-size="16" font-weight="bold" text-anchor="middle" fill="#222222">Baguette seen from above: 5 cuts, each overlapping the last by about one third</text>
  <!-- baguette body -->
  <rect x="80" y="55" width="740" height="70" rx="35" fill="#f1dcb0" stroke="#a8742a" stroke-width="2"/>
  <line x1="95" y1="90" x2="805" y2="90" stroke="#999999" stroke-width="1" stroke-dasharray="6 5"/>
  <text x="826" y="94" font-size="12" fill="#666666">centre line</text>
  <!-- cuts: length 160, overlap ~1/3 (≈53) => step 107 -->
  <g stroke="#7a3e10" stroke-width="4" stroke-linecap="round">
    <line x1="125" y1="96" x2="275" y2="84"/>
    <line x1="232" y1="96" x2="382" y2="84"/>
    <line x1="339" y1="96" x2="489" y2="84"/>
    <line x1="446" y1="96" x2="596" y2="84"/>
    <line x1="553" y1="96" x2="703" y2="84"/>
  </g>
  <g stroke="#2a62a8" stroke-width="1.5" fill="none">
    <line x1="232" y1="140" x2="275" y2="140"/>
    <line x1="232" y1="134" x2="232" y2="146"/>
    <line x1="275" y1="134" x2="275" y2="146"/>
  </g>
  <text x="254" y="162" font-size="12" text-anchor="middle" fill="#2a62a8">overlap ≈ 1/3</text>
  <text x="450" y="162" font-size="12" text-anchor="middle" fill="#444444">cuts almost parallel to the length, close to the centre</text>
  <!-- cross sections -->
  <text x="225" y="205" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">Blade flat, about 30°: an ear (grigne)</text>
  <text x="675" y="205" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">Blade upright, 90°: open cut, no ear</text>
  <!-- left section dough -->
  <path d="M40,380 Q40,260 225,250 Q410,260 410,380 Z" fill="#f1dcb0" stroke="#a8742a" stroke-width="2"/>
  <!-- blade at 30° -->
  <line x1="120" y1="215" x2="250" y2="290" stroke="#555555" stroke-width="5" stroke-linecap="round"/>
  <path d="M190,256 L262,270 L246,296 Z" fill="#ffffff" stroke="#7a3e10" stroke-width="2"/>
  <text x="300" y="300" font-size="12" fill="#444444">cut about 5 mm</text>
  <text x="300" y="316" font-size="12" fill="#444444">under the skin</text>
  <path d="M130,240 A40,40 0 0 1 168,256" fill="none" stroke="#2a62a8" stroke-width="1.5"/>
  <text x="95" y="236" font-size="13" fill="#2a62a8">30°</text>
  <text x="225" y="350" font-size="12" text-anchor="middle" fill="#444444">the flap lifts in the oven and browns: the ear</text>
  <!-- right section dough -->
  <path d="M490,380 Q490,260 675,250 Q860,260 860,380 Z" fill="#f1dcb0" stroke="#a8742a" stroke-width="2"/>
  <line x1="675" y1="210" x2="675" y2="275" stroke="#555555" stroke-width="5" stroke-linecap="round"/>
  <path d="M667,251 L683,251 L675,282 Z" fill="#ffffff" stroke="#7a3e10" stroke-width="2"/>
  <text x="675" y="350" font-size="12" text-anchor="middle" fill="#444444">both sides open evenly: boules, crosses, decorative cuts</text>
  <text x="450" y="412" font-size="12" text-anchor="middle" fill="#444444">Deeper or more cuts for an under-proofed piece; shallower and fewer for an over-proofed one.</text>
</svg>
