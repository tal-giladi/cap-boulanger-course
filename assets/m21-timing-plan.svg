<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d">
  <title id="t">Timing plan for a timed written round</title>
  <desc id="d">A time bar for the course's practice round of 24 points in 36 minutes. The first 4 minutes, about a tenth, are for reading the whole situation and all the documents and marking the verbs. The last 4 minutes, about a tenth, are a reserve for checking and for questions left blank. The 28 minutes between are shared by points: 28 divided by 24 is about 1.2 minutes per point, so a 2-point question gets about 2 and a half minutes, a 3-point question about 3 and a half, a 4-point calculation about 5. Below the bar, a written time plan: question number, points, minutes and the clock time at which each question should be finished, starting at 0:04 and ending at 0:32. The rule underneath: write the finish times on the paper before starting; check the clock at each one; if you are more than two minutes late, shorten the next answers rather than skipping the reserve.</desc>
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#222222">
    <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold">Timing plan: a 24-point round in 36 minutes</text>

    <rect x="40" y="70" width="88" height="60" fill="#e8eef7" stroke="#3b5b8c" stroke-width="2"/>
    <text x="84" y="98" text-anchor="middle" font-size="14" font-weight="bold">Read</text>
    <text x="84" y="118" text-anchor="middle" font-size="13">4 min</text>

    <rect x="128" y="70" width="704" height="60" fill="#e9f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="480" y="98" text-anchor="middle" font-size="14" font-weight="bold">Answer: 28 min shared by points</text>
    <text x="480" y="118" text-anchor="middle" font-size="13">28 ÷ 24 ≈ 1.2 min per point</text>

    <rect x="832" y="70" width="88" height="60" fill="#f3e8f5" stroke="#7b3f8c" stroke-width="2"/>
    <text x="876" y="98" text-anchor="middle" font-size="14" font-weight="bold">Check</text>
    <text x="876" y="118" text-anchor="middle" font-size="13">4 min</text>

    <text x="40" y="150" font-size="12">0:00</text>
    <text x="116" y="150" font-size="12">0:04</text>
    <text x="816" y="150" font-size="12">0:32</text>
    <text x="896" y="150" font-size="12">0:36</text>

    <text x="480" y="192" text-anchor="middle" font-size="16" font-weight="bold">Write this plan in the margin before you start</text>
    <g font-size="14">
      <rect x="230" y="210" width="500" height="30" fill="#f5f5f5" stroke="#888888"/>
      <text x="290" y="230" text-anchor="middle" font-weight="bold">Question</text>
      <text x="420" y="230" text-anchor="middle" font-weight="bold">Points</text>
      <text x="540" y="230" text-anchor="middle" font-weight="bold">Minutes</text>
      <text x="660" y="230" text-anchor="middle" font-weight="bold">Done by</text>
      <rect x="230" y="240" width="500" height="26" fill="#ffffff" stroke="#cccccc"/>
      <text x="290" y="258" text-anchor="middle">1</text><text x="420" y="258" text-anchor="middle">2</text><text x="540" y="258" text-anchor="middle">2.5</text><text x="660" y="258" text-anchor="middle">0:06:30</text>
      <rect x="230" y="266" width="500" height="26" fill="#ffffff" stroke="#cccccc"/>
      <text x="290" y="284" text-anchor="middle">2</text><text x="420" y="284" text-anchor="middle">3</text><text x="540" y="284" text-anchor="middle">3.5</text><text x="660" y="284" text-anchor="middle">0:10</text>
      <rect x="230" y="292" width="500" height="26" fill="#ffffff" stroke="#cccccc"/>
      <text x="290" y="310" text-anchor="middle">3 (calculation)</text><text x="420" y="310" text-anchor="middle">4</text><text x="540" y="310" text-anchor="middle">5</text><text x="660" y="310" text-anchor="middle">0:15</text>
      <rect x="230" y="318" width="500" height="26" fill="#ffffff" stroke="#cccccc"/>
      <text x="290" y="336" text-anchor="middle">…</text><text x="420" y="336" text-anchor="middle">…</text><text x="540" y="336" text-anchor="middle">…</text><text x="660" y="336" text-anchor="middle">…</text>
      <rect x="230" y="344" width="500" height="26" fill="#ffffff" stroke="#cccccc"/>
      <text x="290" y="362" text-anchor="middle">last</text><text x="420" y="362" text-anchor="middle">total 24</text><text x="540" y="362" text-anchor="middle">total 28</text><text x="660" y="362" text-anchor="middle">0:32</text>
    </g>

    <rect x="90" y="400" width="780" height="96" rx="8" fill="#fff4e0" stroke="#c07a00" stroke-width="1.5"/>
    <text x="480" y="428" text-anchor="middle" font-size="15" font-weight="bold">Rules</text>
    <text x="480" y="452" text-anchor="middle" font-size="14">Same method for the real paper: take each part's indicative time and points from the exam page.</text>
    <text x="480" y="476" text-anchor="middle" font-size="14">More than 2 minutes late at a check-point: shorten the next answers; never give up the reserve.</text>
  </g>
</svg>
