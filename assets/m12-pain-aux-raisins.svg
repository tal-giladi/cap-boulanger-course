<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d">
  <title id="t">Making pains aux raisins in four steps</title>
  <desc id="d">Step 1: a laminated sheet about 3.5 millimetres thick spread with a thin even layer of cold crème pâtissière, about 2 millimetres, leaving a bare strip of 2 centimetres at the far edge, brushed with water. Step 2: soaked and drained raisins scattered evenly and pressed in. Step 3: the sheet rolled from the near edge without pulling into a log of even thickness, seam underneath, chilled 15 to 30 minutes. Step 4: the log cut into slices 2 to 2.5 centimetres thick, laid flat with the tail of the spiral tucked underneath, then proofed and baked golden on top and underneath.</desc>
  <rect x="0" y="0" width="900" height="470" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#222222">
    <text x="450" y="32" text-anchor="middle" font-size="21" font-weight="bold">Pain aux raisins: spread, scatter, roll, cut</text>

    <!-- step 1 -->
    <text x="30" y="70" font-size="14" font-weight="bold">1. Spread the cream</text>
    <rect x="30" y="85" width="190" height="150" fill="#ead7a8" stroke="#a8874a" stroke-width="2"/>
    <rect x="30" y="85" width="190" height="130" fill="#f7e08a" stroke="none"/>
    <rect x="30" y="215" width="190" height="20" fill="#ead7a8" stroke="#a8874a" stroke-dasharray="4 3"/>
    <text x="125" y="155" text-anchor="middle" font-size="12">cream about 2 mm</text>
    <text x="30" y="255" font-size="11">bare 2 cm strip at the far edge,</text>
    <text x="30" y="270" font-size="11">brushed with water (the seam)</text>

    <!-- step 2 -->
    <text x="250" y="70" font-size="14" font-weight="bold">2. Scatter the raisins</text>
    <rect x="250" y="85" width="190" height="150" fill="#ead7a8" stroke="#a8874a" stroke-width="2"/>
    <rect x="250" y="85" width="190" height="130" fill="#f7e08a"/>
    <g fill="#5a2d3c">
      <ellipse cx="270" cy="100" rx="6" ry="4"/><ellipse cx="310" cy="112" rx="6" ry="4"/><ellipse cx="350" cy="98" rx="6" ry="4"/><ellipse cx="400" cy="108" rx="6" ry="4"/>
      <ellipse cx="285" cy="140" rx="6" ry="4"/><ellipse cx="330" cy="150" rx="6" ry="4"/><ellipse cx="375" cy="135" rx="6" ry="4"/><ellipse cx="420" cy="150" rx="6" ry="4"/>
      <ellipse cx="270" cy="185" rx="6" ry="4"/><ellipse cx="315" cy="195" rx="6" ry="4"/><ellipse cx="360" cy="180" rx="6" ry="4"/><ellipse cx="410" cy="195" rx="6" ry="4"/>
    </g>
    <text x="250" y="255" font-size="11">soaked 10-15 min, drained, dried,</text>
    <text x="250" y="270" font-size="11">spread evenly, pressed in lightly</text>

    <!-- step 3 -->
    <text x="470" y="70" font-size="14" font-weight="bold">3. Roll, then chill</text>
    <rect x="470" y="140" width="190" height="56" rx="28" fill="#ead7a8" stroke="#a8874a" stroke-width="2"/>
    <ellipse cx="660" cy="168" rx="16" ry="28" fill="#f2dfb0" stroke="#a8874a" stroke-width="2"/>
    <path d="M 660 168 m -3 0 a 3 3 0 1 1 6 0 a 7 7 0 1 1 -14 0 a 11 11 0 1 1 22 0 a 14 18 0 1 1 -28 0" fill="none" stroke="#c9a640" stroke-width="2"/>
    <line x1="530" y1="198" x2="600" y2="198" stroke="#c0392b" stroke-width="4"/>
    <text x="470" y="225" font-size="11">from the near edge, no pulling;</text>
    <text x="470" y="240" font-size="11">seam underneath; fridge 15-30 min</text>
    <text x="470" y="255" font-size="11">so the slices cut clean</text>

    <!-- step 4 -->
    <text x="700" y="70" font-size="14" font-weight="bold">4. Cut 2-2.5 cm slices</text>
    <g stroke="#a8874a" stroke-width="2">
      <circle cx="745" cy="130" r="34" fill="#ead7a8"/>
      <circle cx="830" cy="130" r="34" fill="#ead7a8"/>
    </g>
    <path d="M 745 130 m -3 0 a 3 3 0 1 1 6 0 a 9 9 0 1 1 -18 0 a 15 15 0 1 1 30 0 a 21 21 0 1 1 -42 0 a 27 27 0 1 1 54 0" fill="none" stroke="#c9a640" stroke-width="2.5"/>
    <path d="M 830 130 m -3 0 a 3 3 0 1 1 6 0 a 9 9 0 1 1 -18 0 a 15 15 0 1 1 30 0 a 21 21 0 1 1 -42 0 a 27 27 0 1 1 54 0" fill="none" stroke="#c9a640" stroke-width="2.5"/>
    <text x="700" y="190" font-size="11">laid flat, tail tucked underneath,</text>
    <text x="700" y="205" font-size="11">6 cm apart; weigh two pieces</text>

    <!-- bottom notes -->
    <rect x="30" y="300" width="840" height="140" fill="#f6f3ec" stroke="#cccccc"/>
    <text x="50" y="330" font-size="14" font-weight="bold">Then</text>
    <text x="50" y="355" font-size="13">Proof below about 27 °C (the cold cream slows them: allow a little longer than croissants).</text>
    <text x="50" y="378" font-size="13">Egg wash the dough only. Bake until golden on top AND underneath: a pale base means wet, raw dough.</text>
    <text x="50" y="401" font-size="13">Optional hot nappage for shine. Sell the same day. Cream left after 24 hours is thrown away.</text>
    <text x="50" y="424" font-size="13">Allergens: wheat (gluten), milk, egg, plus sulphites if the raisins list them.</text>
  </g>
</svg>
