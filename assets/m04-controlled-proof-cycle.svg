<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-labelledby="t d">
  <title id="t">A controlled proofing cycle with blocking: cabinet temperature over one night</title>
  <desc id="d">Graph of the cabinet temperature against time for shaped baguettes. At 15:30 the shaped pieces at about 22 degrees go in. Phase 1, cooling, brings them down to about 3 degrees by 17:30. Phase 2, blocking, holds about 3 degrees until 02:30 so fermentation almost stops. Phase 3, warming, raises the temperature gradually to about 20 degrees by 04:30. Phase 4, proofing, holds about 25 degrees and 80 percent humidity until the pieces are ready at 05:45, and they are baked at 06:00. Times are an example; programs depend on the cabinet and the product.</desc>
  <rect x="0" y="0" width="900" height="440" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#222222">
    <text x="450" y="30" text-anchor="middle" font-size="21" font-weight="bold">Pousse contrôlée (blocking): the cabinet runs the night for you</text>

    <!-- axes: x from 80 (15:30) to 860 (06:00): 14.5 h -> 780 px, 53.8 px per hour; y: 0 C at 360, 30 C at 90 -> 9 px per C -->
    <line x1="80" y1="360" x2="865" y2="360" stroke="#444444" stroke-width="2"/>
    <line x1="80" y1="360" x2="80" y2="80" stroke="#444444" stroke-width="2"/>
    <g font-size="12" text-anchor="end">
      <text x="72" y="364">0 °C</text>
      <text x="72" y="319">5</text>
      <text x="72" y="274">10</text>
      <text x="72" y="229">15</text>
      <text x="72" y="184">20</text>
      <text x="72" y="139">25</text>
      <text x="72" y="94">30</text>
    </g>
    <g stroke="#e3e3e3" stroke-width="1">
      <line x1="81" y1="315" x2="865" y2="315"/>
      <line x1="81" y1="270" x2="865" y2="270"/>
      <line x1="81" y1="225" x2="865" y2="225"/>
      <line x1="81" y1="180" x2="865" y2="180"/>
      <line x1="81" y1="135" x2="865" y2="135"/>
    </g>
    <g font-size="12" text-anchor="middle">
      <text x="80" y="380">15:30</text>
      <text x="188" y="380">17:30</text>
      <text x="457" y="380">22:30</text>
      <text x="673" y="380">02:30</text>
      <text x="780" y="380">04:30</text>
      <text x="847" y="380">05:45</text>
    </g>

    <!-- phase bands -->
    <rect x="80" y="80" width="108" height="280" fill="#eef5fb" opacity="0.6"/>
    <rect x="188" y="80" width="485" height="280" fill="#e6eef7" opacity="0.6"/>
    <rect x="673" y="80" width="107" height="280" fill="#fdf1e6" opacity="0.6"/>
    <rect x="780" y="80" width="67" height="280" fill="#fbe2cf" opacity="0.7"/>

    <!-- temperature curve: 22 C at start (y=162), 3 C (y=333) at 17:30, hold to 02:30, up to 20 C (y=180) at 04:30, 25 C (y=135) to 05:45 -->
    <path d="M 80 162 C 110 260, 150 325, 188 333 L 673 333 C 710 300, 750 210, 780 180 L 790 135 L 847 135" fill="none" stroke="#b03a3a" stroke-width="4"/>

    <g font-size="14" font-weight="bold" text-anchor="middle">
      <text x="134" y="105">1 Cooling</text>
      <text x="430" y="105">2 Blocking (blocage)</text>
      <text x="726" y="105">3 Warming</text>
      <text x="813" y="105">4 Proof</text>
    </g>
    <g font-size="12" text-anchor="middle">
      <text x="134" y="125">refroidissement</text>
      <text x="430" y="125">about 2-4 °C: fermentation almost stopped</text>
      <text x="430" y="300">pieces covered or humidity controlled: no dry skin</text>
      <text x="726" y="125">réchauffage,</text>
      <text x="726" y="141">gradual</text>
      <text x="813" y="125">pousse</text>
      <text x="813" y="160">25 °C</text>
      <text x="813" y="176">80 % HR</text>
    </g>
    <text x="134" y="155" font-size="12" text-anchor="middle">pieces in at</text>
    <text x="134" y="171" font-size="12" text-anchor="middle">about 22 °C</text>

    <text x="450" y="412" text-anchor="middle" font-size="13">Shaped at 15:30 the day before · ready at 05:45 · baked at 06:00 · times are an example: follow your cabinet's programs</text>
    <text x="450" y="430" text-anchor="middle" font-size="12" fill="#555555">Large pieces cool and warm more slowly than small ones: the centre lags behind the cabinet air.</text>
  </g>
</svg>
