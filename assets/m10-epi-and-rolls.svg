<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="t d">
  <title id="t">Cutting an épi with scissors, and five shapes of petits pains</title>
  <desc id="d">Top left: side view of a proofed baguette with scissors held low, about 30 to 45 degrees to the dough, cutting about three quarters of the way through and leaving the bottom quarter attached. Top right: top view of the épi: the first cut piece laid to the left, the next to the right, and so on, every 6 to 8 centimetres, five leaves on a 38 centimetre home baguette and six or seven on a 55 centimetre bakery baguette. Bottom: five shapes of 60 gram rolls: a round roll with one cut or a cross; a long roll with one cut along its length; a small fendu with a groove pressed by a thin rod; a small tabatière with a flap; a small épi with three leaves.</desc>
  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#222222">
    <text x="450" y="32" text-anchor="middle" font-size="21" font-weight="bold">The épi and the petits pains</text>

    <!-- side view -->
    <text x="30" y="70" font-size="15" font-weight="bold">1. Side view: scissors low, 3/4 through</text>
    <path d="M 40 170 Q 40 120 90 120 L 360 120 Q 410 120 410 170 Z" fill="#e3cf9f" stroke="#a8874a" stroke-width="2"/>
    <line x1="40" y1="170" x2="410" y2="170" stroke="#555555" stroke-width="2"/>
    <line x1="150" y1="122" x2="212" y2="160" stroke="#7a3b10" stroke-width="3"/>
    <line x1="205" y1="160" x2="205" y2="170" stroke="#c0392b" stroke-width="2"/>
    <text x="250" y="188" font-size="12" fill="#c0392b">bottom quarter stays attached</text>
    <path d="M 118 100 L 160 120 M 134 90 L 168 116" stroke="#555555" stroke-width="3" fill="none"/>
    <circle cx="110" cy="102" r="8" fill="none" stroke="#555555" stroke-width="2"/>
    <circle cx="127" cy="88" r="8" fill="none" stroke="#555555" stroke-width="2"/>
    <text x="180" y="96" font-size="12">blade about 30-45° to the dough</text>
    <text x="40" y="215" font-size="12">One quick, clean cut; lay the piece to one side at once.</text>

    <!-- top view -->
    <text x="470" y="70" font-size="15" font-weight="bold">2. Top view: alternate left and right</text>
    <line x1="480" y1="150" x2="870" y2="150" stroke="#a8874a" stroke-width="2" stroke-dasharray="4 4"/>
    <ellipse cx="500" cy="150" rx="22" ry="14" fill="#e3cf9f" stroke="#a8874a" stroke-width="2"/>
    <ellipse cx="560" cy="122" rx="30" ry="16" transform="rotate(-35 560 122)" fill="#e3cf9f" stroke="#a8874a" stroke-width="2"/>
    <ellipse cx="625" cy="178" rx="30" ry="16" transform="rotate(35 625 178)" fill="#e3cf9f" stroke="#a8874a" stroke-width="2"/>
    <ellipse cx="690" cy="122" rx="30" ry="16" transform="rotate(-35 690 122)" fill="#e3cf9f" stroke="#a8874a" stroke-width="2"/>
    <ellipse cx="755" cy="178" rx="30" ry="16" transform="rotate(35 755 178)" fill="#e3cf9f" stroke="#a8874a" stroke-width="2"/>
    <ellipse cx="830" cy="140" rx="28" ry="15" transform="rotate(-20 830 140)" fill="#e3cf9f" stroke="#a8874a" stroke-width="2"/>
    <text x="560" y="84" text-anchor="middle" font-size="12">1 left</text>
    <text x="625" y="222" text-anchor="middle" font-size="12">2 right</text>
    <text x="690" y="84" text-anchor="middle" font-size="12">3 left</text>
    <text x="755" y="222" text-anchor="middle" font-size="12">4 right</text>
    <text x="670" y="250" text-anchor="middle" font-size="12">a cut every 6-8 cm: about 5 leaves at home (38 cm), 6-7 in a bakery (55 cm)</text>

    <line x1="20" y1="275" x2="880" y2="275" stroke="#cccccc"/>

    <!-- rolls -->
    <text x="450" y="305" text-anchor="middle" font-size="16" font-weight="bold">3. Petits pains (60 g): five classic shapes</text>

    <!-- rond -->
    <circle cx="100" cy="400" r="48" fill="#e3cf9f" stroke="#a8874a" stroke-width="2"/>
    <line x1="72" y1="372" x2="128" y2="428" stroke="#7a3b10" stroke-width="3"/>
    <line x1="128" y1="372" x2="72" y2="428" stroke="#7a3b10" stroke-width="3"/>
    <text x="100" y="475" text-anchor="middle" font-size="13" font-weight="bold">Rond</text>
    <text x="100" y="493" text-anchor="middle" font-size="12">tight ball; cross</text>
    <text x="100" y="509" text-anchor="middle" font-size="12">or one cut</text>

    <!-- long -->
    <ellipse cx="275" cy="400" rx="68" ry="28" fill="#e3cf9f" stroke="#a8874a" stroke-width="2"/>
    <line x1="225" y1="402" x2="325" y2="398" stroke="#7a3b10" stroke-width="3"/>
    <text x="275" y="475" text-anchor="middle" font-size="13" font-weight="bold">Long</text>
    <text x="275" y="493" text-anchor="middle" font-size="12">mini bâtard, 12-14 cm;</text>
    <text x="275" y="509" text-anchor="middle" font-size="12">one long cut</text>

    <!-- fendu -->
    <ellipse cx="450" cy="400" rx="60" ry="32" fill="#e3cf9f" stroke="#a8874a" stroke-width="2"/>
    <path d="M 392 400 Q 450 390 508 400 Q 450 410 392 400 Z" fill="#f6f0e0" stroke="#7a3b10" stroke-width="2"/>
    <text x="450" y="475" text-anchor="middle" font-size="13" font-weight="bold">Fendu</text>
    <text x="450" y="493" text-anchor="middle" font-size="12">groove with a thin rod;</text>
    <text x="450" y="509" text-anchor="middle" font-size="12">proof down, turn up</text>

    <!-- tabatiere -->
    <circle cx="625" cy="400" r="46" fill="#e3cf9f" stroke="#a8874a" stroke-width="2"/>
    <path d="M 588 372 Q 625 356 662 372 L 662 418 Q 625 432 588 418 Z" fill="#d9bf86" stroke="#7a3b10" stroke-width="2"/>
    <text x="625" y="475" text-anchor="middle" font-size="13" font-weight="bold">Tabatière</text>
    <text x="625" y="493" text-anchor="middle" font-size="12">flap about 2-3 mm;</text>
    <text x="625" y="509" text-anchor="middle" font-size="12">proof down, turn up</text>

    <!-- petit epi -->
    <ellipse cx="760" cy="400" rx="18" ry="12" fill="#e3cf9f" stroke="#a8874a" stroke-width="2"/>
    <ellipse cx="795" cy="380" rx="22" ry="13" transform="rotate(-35 795 380)" fill="#e3cf9f" stroke="#a8874a" stroke-width="2"/>
    <ellipse cx="830" cy="420" rx="22" ry="13" transform="rotate(35 830 420)" fill="#e3cf9f" stroke="#a8874a" stroke-width="2"/>
    <ellipse cx="862" cy="392" rx="18" ry="12" transform="rotate(-20 862 392)" fill="#e3cf9f" stroke="#a8874a" stroke-width="2"/>
    <text x="810" y="475" text-anchor="middle" font-size="13" font-weight="bold">Petit épi</text>
    <text x="810" y="493" text-anchor="middle" font-size="12">short roll, 3 cuts</text>
    <text x="810" y="509" text-anchor="middle" font-size="12">with scissors</text>

    <text x="450" y="545" text-anchor="middle" font-size="12">Same weight for every roll in a shape; a tray of one shape is judged as a batch.</text>
  </g>
</svg>
