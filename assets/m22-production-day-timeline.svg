<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d">
  <title id="t">Home production day: four doughs, a crème pâtissière and a one-tray oven, 5:30 to 15:00</title>
  <desc id="d">Timeline from 5:30 to 15:00 with one lane per preparation and one for the oven. Dark bars are hands time, light bars are dough time, orange bars are baking, green bars are cooling. CR-01 croissant dough: détrempe 5:30-5:45, chill until 8:00, lock-in and turn 1 8:00-8:15, turn 2 8:45, turn 3 9:35, final rest until 10:45, shaping 10:45-11:20, proof until 12:50, bakes 12:50-13:32, cooled about 13:52. CP-01 cream: cooked 5:45-6:05, cooled on ice to 10 degrees by about 6:50, fridge until used at 10:45. PC-02 bread: mix 6:20-6:40, pointage until 7:40, divide, détente, shape 8:15-8:40, apprêt, three bakes 9:30-10:46, cooled by about 11:16. VI-01 viennois: mix 7:20-7:40, pointage then fridge, divide 8:55, shape 9:45, apprêt until 11:00, bake 11:00-11:16. PL-01 pain au lait: mix 6:40-7:05, pointage then cold, divide 9:10, cold until 12:20, shape 12:20-12:40, proof, bake 13:37-13:59, cooled 14:29. Oven: preheat 8:40, hot loads at 250 degrees 9:30-10:46, viennois at 190 degrees 11:00-11:16, off 11:16-12:35, viennoiserie loads 12:50-13:32, pain au lait 13:37-13:59. Close: presentation and cleaning 14:00-15:00. The croissant lane is marked as the critical path.</desc>
