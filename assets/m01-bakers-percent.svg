<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Baker's percentages: every ingredient is a percentage of the flour</title>
  <desc id="d">Bar chart for a lean dough made with 1000 g of flour. Flour is 100 percent, 1000 g. Water is 65 percent, 650 g. Salt is 1.8 percent, 18 g. Fresh yeast is 1.5 percent, 15 g. The total is 168.3 percent, 1683 g of dough. A second panel shows the common mistake: as a share of the total dough, water is only 38.6 percent, which is not the baker's percentage.</desc>
  <rect x="0" y="0" width="900" height="470" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">Baker's percentages: flour = 100, everything else is compared with the flour</text>

  <!-- scale: 1000 g = 500 px -->
  <g font-size="14" fill="#111827">
    <text x="30" y="88" font-weight="bold">Flour</text>
    <rect x="160" y="68" width="500" height="32" fill="#e8c27a" stroke="#7a5a12"/>
    <text x="675" y="90">100% → 1000 g</text>

    <text x="30" y="138" font-weight="bold">Water</text>
    <rect x="160" y="118" width="325" height="32" fill="#93c5fd" stroke="#1f4e79"/>
    <text x="500" y="140">65% → 1000 × 0.65 = 650 g</text>

    <text x="30" y="188" font-weight="bold">Salt</text>
    <rect x="160" y="168" width="9" height="32" fill="#9ca3af" stroke="#374151"/>
    <text x="185" y="190">1.8% → 1000 × 0.018 = 18 g</text>

    <text x="30" y="238" font-weight="bold">Fresh yeast</text>
    <rect x="160" y="218" width="7.5" height="32" fill="#c4b5a0" stroke="#5b4636"/>
    <text x="185" y="240">1.5% → 1000 × 0.015 = 15 g</text>

    <line x1="30" y1="268" x2="870" y2="268" stroke="#111827" stroke-width="1.5"/>
    <text x="30" y="295" font-weight="bold">Total dough</text>
    <text x="160" y="295">100 + 65 + 1.8 + 1.5 = 168.3%  →  1683 g</text>
  </g>

  <!-- formulas box -->
  <rect x="30" y="320" width="400" height="130" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
  <g font-size="14" fill="#111827">
    <text x="45" y="345" font-weight="bold">Three formulas</text>
    <text x="45" y="372">ingredient % = ingredient g ÷ flour g × 100</text>
    <text x="45" y="398">ingredient g = flour g × % ÷ 100</text>
    <text x="45" y="424">flour g = total dough g × 100 ÷ total %</text>
  </g>

  <!-- mistake box -->
  <rect x="460" y="320" width="410" height="130" rx="8" fill="#fde8e8" stroke="#b91c1c"/>
  <g font-size="14" fill="#111827">
    <text x="475" y="345" font-weight="bold" fill="#b91c1c">Common mistake: percent of the dough</text>
    <text x="475" y="372">650 g water ÷ 1683 g dough = 38.6%</text>
    <text x="475" y="398">That is the share of the dough, not the</text>
    <text x="475" y="424">hydration. Hydration = 650 ÷ 1000 = 65%.</text>
  </g>
</svg>
