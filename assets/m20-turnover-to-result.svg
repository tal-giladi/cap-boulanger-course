<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">From turnover to result: one month of a craft bakery (example figures)</title>
  <desc id="d">Waterfall of horizontal bars for Au Pain de la Halle in October, example figures of lesson 20.5, euros before VAT. Turnover 40,208. Minus intermediate consumption (raw materials and packaging 12,000, energy 2,400, rent 2,200, other external charges 1,800) 18,400 gives the value added 21,808. Minus staff costs (gross wages 13,000 and employer contributions 3,500) 16,500 and taxes on production 200 gives the gross operating surplus 5,108. Minus depreciation of equipment 1,500 and bank interest 300 gives the result before corporate tax, 3,308. Brackets show who receives each share of the value added: staff and social bodies, the State, lenders, and the business itself.</desc>
  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">From turnover to result — one month, euros HT (example figures)</text>

  <g font-size="13" fill="#111827">
    <!-- row 1 turnover -->
    <text x="190" y="72" text-anchor="end" font-weight="bold">Turnover (CA HT)</text>
    <rect x="200" y="56" width="600" height="24" fill="#93c5fd" stroke="#1f4e79"/>
    <text x="805" y="73">40,208</text>

    <!-- row 2 intermediate consumption -->
    <text x="190" y="112" text-anchor="end">− Intermediate consumption</text>
    <rect x="525.4" y="96" width="274.6" height="24" fill="#fca5a5" stroke="#991b1b"/>
    <text x="805" y="113">18,400</text>
    <text x="530" y="136" font-size="11" fill="#374151">materials 12,000 · energy 2,400 · rent 2,200 · other 1,800</text>

    <!-- row 3 value added -->
    <text x="190" y="166" text-anchor="end" font-weight="bold">= Value added</text>
    <rect x="200" y="150" width="325.4" height="24" fill="#86efac" stroke="#166534"/>
    <text x="531" y="167" font-weight="bold">21,808</text>

    <!-- row 4 staff -->
    <text x="190" y="206" text-anchor="end">− Staff costs</text>
    <rect x="279.2" y="190" width="246.2" height="24" fill="#fde68a" stroke="#92400e"/>
    <text x="531" y="207">16,500 (wages 13,000 + employer contributions 3,500)</text>

    <!-- row 5 taxes -->
    <text x="190" y="246" text-anchor="end">− Taxes on production</text>
    <rect x="276.2" y="230" width="3" height="24" fill="#c4b5fd" stroke="#5b21b6"/>
    <text x="285" y="247">200</text>

    <!-- row 6 EBE -->
    <text x="190" y="286" text-anchor="end" font-weight="bold">= Gross operating surplus</text>
    <rect x="200" y="270" width="76.2" height="24" fill="#86efac" stroke="#166534"/>
    <text x="282" y="287" font-weight="bold">5,108 (EBE)</text>

    <!-- row 7 depreciation -->
    <text x="190" y="326" text-anchor="end">− Depreciation of equipment</text>
    <rect x="253.8" y="310" width="22.4" height="24" fill="#d1d5db" stroke="#374151"/>
    <text x="282" y="327">1,500</text>

    <!-- row 8 interest -->
    <text x="190" y="366" text-anchor="end">− Bank interest</text>
    <rect x="249.4" y="350" width="4.5" height="24" fill="#d1d5db" stroke="#374151"/>
    <text x="260" y="367">300</text>

    <!-- row 9 result -->
    <text x="190" y="406" text-anchor="end" font-weight="bold">= Result before tax</text>
    <rect x="200" y="390" width="49.4" height="24" fill="#22c55e" stroke="#166534"/>
    <text x="255" y="407" font-weight="bold">3,308 → corporate tax (IS) is on the year's result</text>
  </g>

  <!-- who gets the value added -->
  <g font-size="13" fill="#111827">
    <rect x="40" y="440" width="820" height="100" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="55" y="464" font-weight="bold">Who receives the value added (21,808)</text>
    <text x="55" y="486">Staff and social bodies: 16,500 (76 %)   ·   State: 200 (1 %)   ·   Lenders: 300 (1 %)</text>
    <text x="55" y="508">The business itself: depreciation 1,500 + result 3,308 = 4,808 (22 %) — to replace equipment, pay tax, reward the owners, invest</text>
    <text x="55" y="530" font-size="12" fill="#374151">Value added = production − intermediate consumption (INSEE). Energy at 0.20 € per kWh (lesson 18.1); VAT is not in these figures.</text>
  </g>
</svg>
