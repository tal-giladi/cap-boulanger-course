<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="t d">
  <title id="t">Energy on a bake day: where it goes and the levers the baker controls</title>
  <desc id="d">Top: a horizontal bar of a craft bakery's energy use according to the CNBPF: heat production 65 percent, cold production 22 percent, mechanical equipment 8 percent, lighting 5 percent. Bottom: a bake-day timeline from 2:00 to 9:00 for a deck oven. Habit: oven on at 2:00, running empty until the first load at 5:30, about 12 kWh wasted on a 5 square metre deck. Plan: preheat from 4:00 using the measured preheat of 1 hour 30, baguettes at 250 degrees with steam from 5:30, campagne at 230 degrees, pains au lait at 180 degrees on the falling heat with the steam off, oven off about 10 minutes before the end of the last bake. Side notes: cold set points minus 18 and plus 4 degrees, more than 5 percent per degree colder; steam up to 15 percent of a bread bake; 230 instead of 250 degrees saves about 10 percent.</desc>
  <rect x="0" y="0" width="960" height="600" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#222222">
    <text x="480" y="32" text-anchor="middle" font-size="21" font-weight="bold">Energy on a bake day: where it goes, what the baker controls</text>

    <!-- energy split bar -->
    <text x="40" y="70" font-size="15" font-weight="bold">Energy use of a craft bakery (CNBPF)</text>
    <g font-size="14" text-anchor="middle">
      <rect x="40" y="82" width="572" height="48" fill="#b5462a"/>
      <text x="326" y="112" fill="#ffffff" font-weight="bold">Heat production (ovens) 65 %</text>
      <rect x="612" y="82" width="194" height="48" fill="#3b78a8"/>
      <text x="709" y="112" fill="#ffffff" font-weight="bold">Cold 22 %</text>
      <rect x="806" y="82" width="70" height="48" fill="#7a7a7a"/>
      <text x="841" y="104" fill="#ffffff" font-size="12">Motors</text>
      <text x="841" y="120" fill="#ffffff" font-size="12">8 %</text>
      <rect x="876" y="82" width="44" height="48" fill="#d9b44a"/>
      <text x="898" y="104" font-size="12">Light</text>
      <text x="898" y="120" font-size="12">5 %</text>
    </g>

    <!-- timeline axis -->
    <text x="40" y="172" font-size="15" font-weight="bold">One deck oven, 2:00 to 9:00</text>
    <g font-size="13" text-anchor="middle" fill="#555555">
      <line x1="160" y1="380" x2="900" y2="380" stroke="#888888" stroke-width="1.5"/>
      <line x1="160" y1="374" x2="160" y2="386" stroke="#888888"/><text x="160" y="402">2:00</text>
      <line x1="266" y1="374" x2="266" y2="386" stroke="#888888"/><text x="266" y="402">3:00</text>
      <line x1="371" y1="374" x2="371" y2="386" stroke="#888888"/><text x="371" y="402">4:00</text>
      <line x1="477" y1="374" x2="477" y2="386" stroke="#888888"/><text x="477" y="402">5:00</text>
      <line x1="583" y1="374" x2="583" y2="386" stroke="#888888"/><text x="583" y="402">6:00</text>
      <line x1="689" y1="374" x2="689" y2="386" stroke="#888888"/><text x="689" y="402">7:00</text>
      <line x1="794" y1="374" x2="794" y2="386" stroke="#888888"/><text x="794" y="402">8:00</text>
      <line x1="900" y1="374" x2="900" y2="386" stroke="#888888"/><text x="900" y="402">9:00</text>
    </g>

    <!-- habit lane -->
    <text x="40" y="222" font-size="14" font-weight="bold">Habit</text>
    <rect x="160" y="200" width="212" height="34" fill="#f2c6b8" stroke="#b5462a"/>
    <text x="266" y="222" text-anchor="middle" font-size="13">running empty: ~12 kWh</text>
    <rect x="372" y="200" width="158" height="34" fill="#f7e2c8" stroke="#b5462a"/>
    <text x="451" y="222" text-anchor="middle" font-size="13">preheat</text>
    <rect x="530" y="200" width="300" height="34" fill="#b5462a"/>
    <text x="680" y="222" text-anchor="middle" font-size="13" fill="#ffffff">bakes, oven left on, steam on all decks</text>
    <text x="160" y="196" font-size="12" fill="#b5462a">on at 2:00</text>

    <!-- plan lane -->
    <text x="40" y="292" font-size="14" font-weight="bold">Plan</text>
    <rect x="371" y="270" width="159" height="34" fill="#f7e2c8" stroke="#2e7d4f"/>
    <text x="451" y="292" text-anchor="middle" font-size="13">preheat 1 h 30</text>
    <text x="371" y="266" font-size="12" fill="#2e7d4f">on at 4:00 (card)</text>
    <rect x="530" y="270" width="106" height="34" fill="#8e3a20"/>
    <text x="583" y="286" text-anchor="middle" font-size="12" fill="#ffffff">baguettes</text>
    <text x="583" y="300" text-anchor="middle" font-size="12" fill="#ffffff">250 °C + steam</text>
    <rect x="636" y="270" width="88" height="34" fill="#b5642a"/>
    <text x="680" y="286" text-anchor="middle" font-size="12" fill="#ffffff">campagne</text>
    <text x="680" y="300" text-anchor="middle" font-size="12" fill="#ffffff">230 °C</text>
    <rect x="724" y="270" width="96" height="34" fill="#d99a52"/>
    <text x="772" y="286" text-anchor="middle" font-size="12">pains au lait</text>
    <text x="772" y="300" text-anchor="middle" font-size="12">180 °C, no steam</text>
    <rect x="820" y="270" width="40" height="34" fill="#f3dfb8" stroke="#2e7d4f" stroke-dasharray="4 3"/>
    <text x="840" y="292" text-anchor="middle" font-size="11">off</text>

    <!-- arrows/levers -->
    <g font-size="12" fill="#2e7d4f">
      <path d="M 266 318 L 266 340" stroke="#2e7d4f" stroke-width="2" fill="none"/>
      <text x="170" y="356">1. Preheat from the real time:</text>
      <text x="170" y="370">2 h of empty running saved</text>
      <path d="M 583 318 L 583 340" stroke="#2e7d4f" stroke-width="2" fill="none"/>
      <text x="470" y="356">2. Hottest first, steam only</text>
      <text x="470" y="370">on bread decks</text>
      <path d="M 790 318 L 790 340" stroke="#2e7d4f" stroke-width="2" fill="none"/>
      <text x="700" y="356">3. Falling heat; off ~10 min</text>
      <text x="700" y="370">before the end of the last bake</text>
    </g>

    <!-- figure boxes -->
    <g font-size="13">
      <rect x="40" y="430" width="280" height="140" fill="#fbf6ec" stroke="#cccccc"/>
      <text x="56" y="456" font-weight="bold">Oven (CNBPF)</text>
      <text x="56" y="480">5 m² deck empty 2 h/day: ~12 kWh/day,</text>
      <text x="56" y="498">over 3,300 kWh a year</text>
      <text x="56" y="520">230 instead of 250 °C: about −10 %</text>
      <text x="56" y="542">Steam: up to 15 % of a bread bake</text>
      <text x="56" y="562">Door open &gt; 5 min in 4 h: about +5 %</text>

      <rect x="340" y="430" width="280" height="140" fill="#eef4f9" stroke="#cccccc"/>
      <text x="356" y="456" font-weight="bold">Cold (CNBPF)</text>
      <text x="356" y="480">Set points about −18 °C and +4 °C</text>
      <text x="356" y="500">Each degree colder: more than +5 %</text>
      <text x="356" y="520">Unit in a 30 °C room: about +40 %</text>
      <text x="356" y="540">Freezing hot products: about +40 %</text>
      <text x="356" y="560">Slow proof: ~35 % less than blocked</text>

      <rect x="640" y="430" width="280" height="140" fill="#eef7f1" stroke="#cccccc"/>
      <text x="656" y="456" font-weight="bold">Water (CCI, CNBPF)</text>
      <text x="656" y="480">Aerator: 12 → 6-8 L/min (−30-50 %)</text>
      <text x="656" y="500">Dripping tap: ~15 m³ a year</text>
      <text x="656" y="520">Running toilet: ~250 m³ a year</text>
      <text x="656" y="540">Meter read at night finds leaks</text>
      <text x="656" y="560">1 mm of scale: steam −10 %</text>
    </g>
  </g>
</svg>
