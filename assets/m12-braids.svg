<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" role="img" aria-labelledby="t d">
  <title id="t">Braids of one, two and three strands, and small pieces of pâte levée</title>
  <desc id="d">Left: one-strand braid. A long strand laid in a U, the ends crossed to make a loop like a pretzel, one end passed through the loop from underneath, the loop given half a turn, and the end passed through again until the strand is used up. Middle: two-strand braid. Two strands laid in a cross; the two ends of the lower strand are swapped over the upper one, then the two ends of the other strand, alternating, giving a tall square braid. Right: three-strand braid. Three strands side by side, braided from the centre: left over middle, then right over middle, without pulling; the braid is turned and the other half braided the same way. Bottom: small pieces of 50 to 60 grams: a navette with pointed ends, a hedgehog with a pointed nose and snipped spines, a snail spiral with a raised head, a turtle with four feet, a head and a crossed shell.</desc>
  <rect x="0" y="0" width="900" height="640" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#222222">
    <text x="450" y="32" text-anchor="middle" font-size="21" font-weight="bold">Braiding pâte levée: one, two and three strands</text>

    <!-- one strand -->
    <text x="150" y="70" text-anchor="middle" font-size="15" font-weight="bold">1 strand</text>
    <text x="150" y="88" text-anchor="middle" font-size="11">300 g, strand 60-70 cm</text>
    <path d="M 90 230 Q 90 120 150 120 Q 210 120 210 230" fill="none" stroke="#c99a45" stroke-width="14" stroke-linecap="round"/>
    <text x="150" y="255" text-anchor="middle" font-size="11">a. lay it in a U</text>
    <path d="M 105 365 Q 150 345 165 325 Q 185 295 150 280 Q 115 295 135 325 Q 150 345 195 365" fill="none" stroke="#c99a45" stroke-width="12" stroke-linecap="round"/>
    <text x="150" y="385" text-anchor="middle" font-size="11">b. cross the ends: a loop</text>
    <ellipse cx="150" cy="430" rx="40" ry="18" fill="none" stroke="#c99a45" stroke-width="11"/>
    <path d="M 150 470 Q 150 440 150 412" fill="none" stroke="#7a5a2a" stroke-width="8" stroke-linecap="round"/>
    <path d="M 125 405 A 30 14 0 0 1 175 405" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#a)"/>
    <text x="150" y="495" text-anchor="middle" font-size="11">c. end through the loop from below,</text>
    <text x="150" y="510" text-anchor="middle" font-size="11">loop half a turn, repeat</text>

    <!-- two strands -->
    <text x="450" y="70" text-anchor="middle" font-size="15" font-weight="bold">2 strands</text>
    <text x="450" y="88" text-anchor="middle" font-size="11">2 × 150 g, about 40 cm each</text>
    <line x1="370" y1="170" x2="530" y2="170" stroke="#c99a45" stroke-width="14" stroke-linecap="round"/>
    <line x1="450" y1="110" x2="450" y2="230" stroke="#b5833a" stroke-width="14" stroke-linecap="round"/>
    <text x="450" y="255" text-anchor="middle" font-size="11">a. lay them in a cross (+)</text>
    <path d="M 380 330 Q 450 290 520 330" fill="none" stroke="#c99a45" stroke-width="12" stroke-linecap="round"/>
    <path d="M 520 300 Q 450 340 380 300" fill="none" stroke="#c99a45" stroke-width="12" stroke-linecap="round"/>
    <line x1="450" y1="280" x2="450" y2="360" stroke="#b5833a" stroke-width="12" stroke-linecap="round"/>
    <text x="450" y="385" text-anchor="middle" font-size="11">b. swap the two ends of the lower strand</text>
    <text x="450" y="400" text-anchor="middle" font-size="11">over the upper one, then the other strand</text>
    <rect x="410" y="420" width="80" height="70" rx="10" fill="#e3b866" stroke="#a8874a" stroke-width="2"/>
    <path d="M 410 445 L 490 445 M 410 468 L 490 468 M 437 420 L 437 490 M 463 420 L 463 490" stroke="#a8874a" stroke-width="1.5"/>
    <text x="450" y="510" text-anchor="middle" font-size="11">c. tall square braid, laid on its side</text>

    <!-- three strands -->
    <text x="750" y="70" text-anchor="middle" font-size="15" font-weight="bold">3 strands</text>
    <text x="750" y="88" text-anchor="middle" font-size="11">3 × 100 g, about 35 cm each</text>
    <line x1="715" y1="110" x2="715" y2="230" stroke="#c99a45" stroke-width="14" stroke-linecap="round"/>
    <line x1="750" y1="110" x2="750" y2="230" stroke="#b5833a" stroke-width="14" stroke-linecap="round"/>
    <line x1="785" y1="110" x2="785" y2="230" stroke="#d9b06a" stroke-width="14" stroke-linecap="round"/>
    <circle cx="750" cy="170" r="5" fill="#c0392b"/>
    <text x="750" y="255" text-anchor="middle" font-size="11">a. start in the MIDDLE (red dot)</text>
    <path d="M 715 280 Q 735 300 750 320 Q 765 340 785 360" fill="none" stroke="#c99a45" stroke-width="12" stroke-linecap="round"/>
    <path d="M 785 280 Q 765 300 750 320" fill="none" stroke="#d9b06a" stroke-width="12" stroke-linecap="round"/>
    <path d="M 750 280 Q 740 320 715 360" fill="none" stroke="#b5833a" stroke-width="12" stroke-linecap="round"/>
    <text x="750" y="385" text-anchor="middle" font-size="11">b. left over middle, right over middle,</text>
    <text x="750" y="400" text-anchor="middle" font-size="11">no pulling; turn and braid the other half</text>
    <ellipse cx="750" cy="455" rx="70" ry="28" fill="#e3b866" stroke="#a8874a" stroke-width="2"/>
    <path d="M 690 455 Q 705 435 720 455 Q 735 475 750 455 Q 765 435 780 455 Q 795 475 810 455" fill="none" stroke="#a8874a" stroke-width="1.5"/>
    <text x="750" y="510" text-anchor="middle" font-size="11">c. plump middle, tapered ends tucked under</text>

    <!-- small pieces -->
    <line x1="30" y1="535" x2="870" y2="535" stroke="#cccccc"/>
    <text x="30" y="560" font-size="14" font-weight="bold">Small pieces (50-60 g), all identical on the tray:</text>
    <path d="M 60 605 Q 110 575 160 605 Q 110 625 60 605 Z" fill="#e3b866" stroke="#a8874a" stroke-width="2"/>
    <text x="110" y="635" text-anchor="middle" font-size="11">navette</text>
    <path d="M 270 610 Q 270 575 310 578 Q 340 582 360 605 Q 340 625 300 625 Q 272 625 270 610 Z" fill="#d9a85a" stroke="#a8874a" stroke-width="2"/>
    <path d="M 285 590 l 6 -6 M 300 586 l 6 -6 M 315 588 l 6 -6 M 290 605 l 6 -6 M 305 602 l 6 -6 M 320 604 l 6 -6" stroke="#7a5a2a" stroke-width="2"/>
    <circle cx="345" cy="600" r="2.5" fill="#3a2010"/>
    <text x="315" y="635" text-anchor="middle" font-size="11">hérisson</text>
    <path d="M 520 600 m -3 0 a 3 3 0 1 1 6 0 a 8 8 0 1 1 -16 0 a 13 13 0 1 1 26 0 a 18 18 0 1 1 -36 0" fill="none" stroke="#c99a45" stroke-width="7"/>
    <circle cx="552" cy="585" r="8" fill="#c99a45"/>
    <text x="520" y="635" text-anchor="middle" font-size="11">escargot</text>
    <ellipse cx="730" cy="602" rx="32" ry="20" fill="#e3b866" stroke="#a8874a" stroke-width="2"/>
    <path d="M 708 602 L 752 602 M 730 584 L 730 620" stroke="#a8874a" stroke-width="1.5"/>
    <circle cx="770" cy="602" r="7" fill="#e3b866" stroke="#a8874a" stroke-width="2"/>
    <circle cx="708" cy="582" r="5" fill="#e3b866" stroke="#a8874a"/><circle cx="752" cy="582" r="5" fill="#e3b866" stroke="#a8874a"/>
    <circle cx="708" cy="622" r="5" fill="#e3b866" stroke="#a8874a"/><circle cx="752" cy="622" r="5" fill="#e3b866" stroke="#a8874a"/>
    <text x="730" y="635" text-anchor="middle" font-size="11">tortue</text>
  </g>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>
</svg>
