<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="t d">
  <title id="t">Marche en avant: clean and dirty flows never cross</title>
  <desc id="d">Top half, the marche en avant in space: a row of zones from left to right, from dirty to clean: delivery and unpacking, dry store and cold rooms, weighing and mixing, shaping and proofing, oven, cooling racks, finishing and assembly of sensitive products such as sandwiches and crème pâtissière, shop. Products only move forward. Below them a separate return path carries dirty trays and tools to the washing area and waste to the bins and out through a separate exit, without crossing the clean zones. Staff enter through the changing room and the hand basin. Bottom half, the marche en avant in time, used when one bench serves several jobs: first the clean, sensitive job, then cleaning and disinfection, then the dirty job, then cleaning again; for example assembling sandwiches at 6:00, cleaning, then cracking eggs at 7:00, cleaning.</desc>
  <rect x="0" y="0" width="960" height="600" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#222222">
    <text x="480" y="32" text-anchor="middle" font-size="22" font-weight="bold">Marche en avant: dirty never meets clean</text>
    <text x="480" y="56" text-anchor="middle" font-size="14">In space (separate zones and routes) or in time (one job after the other, with cleaning in between).</text>

    <text x="20" y="92" font-size="16" font-weight="bold">1 · In space</text>
    <g stroke="#5a3a1a" stroke-width="2">
      <rect x="20" y="110" width="100" height="90" rx="8" fill="#e9d6c3"/>
      <rect x="135" y="110" width="100" height="90" rx="8" fill="#efdcb3"/>
      <rect x="250" y="110" width="100" height="90" rx="8" fill="#f6e7c8"/>
      <rect x="365" y="110" width="100" height="90" rx="8" fill="#f6e7c8"/>
      <rect x="480" y="110" width="100" height="90" rx="8" fill="#f2c98f"/>
      <rect x="595" y="110" width="100" height="90" rx="8" fill="#e6f0e6"/>
      <rect x="710" y="110" width="110" height="90" rx="8" fill="#d6ebd6"/>
      <rect x="835" y="110" width="105" height="90" rx="8" fill="#c8e3c8"/>
    </g>
    <g font-size="13" text-anchor="middle">
      <text x="70" y="140" font-weight="bold">Delivery,</text>
      <text x="70" y="158" font-weight="bold">unpacking</text>
      <text x="70" y="180">cartons out</text>
      <text x="185" y="140" font-weight="bold">Dry store,</text>
      <text x="185" y="158" font-weight="bold">cold rooms</text>
      <text x="185" y="180">off the floor</text>
      <text x="300" y="140" font-weight="bold">Weighing,</text>
      <text x="300" y="158" font-weight="bold">mixing</text>
      <text x="415" y="140" font-weight="bold">Dividing,</text>
      <text x="415" y="158" font-weight="bold">shaping,</text>
      <text x="415" y="176" font-weight="bold">proofing</text>
      <text x="530" y="140" font-weight="bold">Oven</text>
      <text x="530" y="160">kill step</text>
      <text x="530" y="178">for the crumb</text>
      <text x="645" y="140" font-weight="bold">Cooling</text>
      <text x="645" y="158" font-weight="bold">racks</text>
      <text x="645" y="180">not baked again</text>
      <text x="765" y="140" font-weight="bold">Finishing:</text>
      <text x="765" y="158">sandwiches,</text>
      <text x="765" y="176">creams</text>
      <text x="765" y="194" font-weight="bold" fill="#1d5c1d">most sensitive</text>
      <text x="887" y="140" font-weight="bold">Shop</text>
      <text x="887" y="160">display,</text>
      <text x="887" y="178">sale</text>
    </g>
    <g stroke="#2a6a2a" stroke-width="3" fill="none">
      <line x1="40" y1="224" x2="900" y2="224"/>
    </g>
    <polygon points="900,216 900,232 916,224" fill="#2a6a2a"/>
    <text x="480" y="246" text-anchor="middle" font-size="14" fill="#2a6a2a" font-weight="bold">Products move one way only: forward, from dirty to clean</text>

    <g stroke="#8a1c0c" stroke-width="3" fill="none" stroke-dasharray="8 6">
      <path d="M 760 262 L 760 300 L 200 300 L 200 330"/>
    </g>
    <polygon points="192,330 208,330 200,346" fill="#8a1c0c"/>
    <g stroke="#5a3a1a" stroke-width="2">
      <rect x="110" y="350" width="180" height="50" rx="8" fill="#f6dede"/>
      <rect x="320" y="350" width="180" height="50" rx="8" fill="#f6dede"/>
      <rect x="560" y="350" width="200" height="50" rx="8" fill="#e8eef6"/>
    </g>
    <g font-size="13" text-anchor="middle">
      <text x="200" y="372" font-weight="bold">Plonge (washing)</text>
      <text x="200" y="390">dirty trays, tools</text>
      <text x="410" y="372" font-weight="bold">Waste, bins</text>
      <text x="410" y="390">out by a separate exit</text>
      <text x="660" y="372" font-weight="bold">Staff: changing room</text>
      <text x="660" y="390">→ hand basin → work</text>
    </g>
    <text x="480" y="322" text-anchor="middle" font-size="14" fill="#8a1c0c" font-weight="bold">Dirty returns use their own route and never cross the finishing bench</text>

    <text x="20" y="450" font-size="16" font-weight="bold">2 · In time (one bench, several jobs)</text>
    <g stroke="#5a3a1a" stroke-width="2">
      <rect x="20" y="470" width="200" height="80" rx="8" fill="#d6ebd6"/>
      <rect x="250" y="470" width="200" height="80" rx="8" fill="#e8eef6"/>
      <rect x="480" y="470" width="200" height="80" rx="8" fill="#f6dede"/>
      <rect x="710" y="470" width="230" height="80" rx="8" fill="#e8eef6"/>
    </g>
    <g font-size="13" text-anchor="middle">
      <text x="120" y="498" font-weight="bold">6:00 Clean job first</text>
      <text x="120" y="518">assemble sandwiches</text>
      <text x="120" y="536">(ready-to-eat)</text>
      <text x="350" y="498" font-weight="bold">Clean and disinfect</text>
      <text x="350" y="518">bench, tools;</text>
      <text x="350" y="536">wash hands</text>
      <text x="580" y="498" font-weight="bold">7:00 Dirty job</text>
      <text x="580" y="518">crack eggs, unpack</text>
      <text x="580" y="536">cartons, raw products</text>
      <text x="825" y="498" font-weight="bold">Clean and disinfect again</text>
      <text x="825" y="518">before the next</text>
      <text x="825" y="536">clean job</text>
    </g>
    <g fill="#333333">
      <polygon points="222,504 222,516 246,510"/>
      <polygon points="452,504 452,516 476,510"/>
      <polygon points="682,504 682,516 706,510"/>
    </g>
    <text x="480" y="584" text-anchor="middle" font-size="12" fill="#555555">Source: CNBPF, L'essentiel des bonnes pratiques d'hygiène en boulangerie-pâtisserie (2026), theme 4. See also lesson 01.2 (zones of a bakery).</text>
  </g>
</svg>
