<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="t d">
  <title id="t">The food-waste hierarchy applied to a bakery</title>
  <desc id="d">An inverted pyramid in five levels, most preferred at the top. Level 1, prevent: size loads from the unsold counts, make the last load smaller, take orders, first in first out for raw materials. Level 2, use for people: reduced-price anti-waste baskets, chapelure, croutons, pain perdu, crumb in pain courant dough but never in tradition, donation to a food-aid association. Level 3, animal feed through an allowed channel. Level 4, compost or methanisation through the biowaste collection, compulsory sorting for all professionals since 1 January 2024. Level 5, residual waste only for what is left. A side panel lists the dry waste streams: paper and cardboard such as flour sacks and boxes, plastic film, metal, glass, wood, textiles since 2025; under 1,100 litres a week with the municipal collection, follow the commune's sorting rules.</desc>
  <rect x="0" y="0" width="960" height="600" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#222222">
    <text x="480" y="32" text-anchor="middle" font-size="21" font-weight="bold">Food waste in a bakery: the order of priority (loi Garot 2016)</text>

    <!-- pyramid levels -->
    <polygon points="30,60 650,60 618,148 62,148" fill="#2e7d4f"/>
    <polygon points="62,152 618,152 586,240 94,240" fill="#5c9a4a"/>
    <polygon points="94,244 586,244 554,332 126,332" fill="#9bb04a"/>
    <polygon points="126,336 554,336 522,424 158,424" fill="#c8973e"/>
    <polygon points="158,428 522,428 490,516 190,516" fill="#9a5a3a"/>

    <g font-size="14" fill="#ffffff">
      <text x="340" y="84" text-anchor="middle" font-size="17" font-weight="bold">1. Prevent</text>
      <text x="340" y="106" text-anchor="middle">Size loads from the unsold counts; last load smaller;</text>
      <text x="340" y="126" text-anchor="middle">orders for large quantities; FIFO for raw materials</text>

      <text x="340" y="176" text-anchor="middle" font-size="17" font-weight="bold">2. Use for people</text>
      <text x="340" y="198" text-anchor="middle">Anti-waste baskets; chapelure, croûtons, pain perdu;</text>
      <text x="340" y="218" text-anchor="middle">crumb in pain courant (never tradition); donation</text>

      <text x="340" y="270" text-anchor="middle" font-size="17" font-weight="bold" fill="#222222">3. Animal feed</text>
      <text x="340" y="292" text-anchor="middle" fill="#222222">only through a channel the rules allow;</text>
      <text x="340" y="312" text-anchor="middle" fill="#222222">ask the house first</text>

      <text x="340" y="362" text-anchor="middle" font-size="17" font-weight="bold" fill="#222222">4. Compost or methanisation</text>
      <text x="340" y="384" text-anchor="middle" fill="#222222">biowaste bin: scraps, spoiled bread, eggshells;</text>
      <text x="340" y="404" text-anchor="middle" fill="#222222">sorting compulsory for all since 1 Jan 2024</text>

      <text x="340" y="458" text-anchor="middle" font-size="17" font-weight="bold">5. Residual waste</text>
      <text x="340" y="480" text-anchor="middle">only what cannot go</text>
      <text x="340" y="500" text-anchor="middle">anywhere above</text>
    </g>

    <!-- arrow preferred -->
    <g font-size="13" fill="#555555">
      <path d="M 18 500 L 18 80" stroke="#555555" stroke-width="2" fill="none"/>
      <polygon points="18,70 12,84 24,84" fill="#555555"/>
      <text x="0" y="0" transform="translate(12 380) rotate(-90)" text-anchor="middle" font-size="12">more preferred</text>
    </g>

    <!-- side panel dry waste -->
    <rect x="680" y="60" width="260" height="364" fill="#fbf6ec" stroke="#cccccc"/>
    <text x="810" y="88" text-anchor="middle" font-size="16" font-weight="bold">Dry waste: sort by stream</text>
    <g font-size="13">
      <rect x="696" y="104" width="18" height="18" fill="#3b78a8"/>
      <text x="722" y="118">Paper / cardboard: flour sacks</text>
      <text x="722" y="136">(shaken out), boxes, paper bags</text>
      <rect x="696" y="150" width="18" height="18" fill="#e3a63a"/>
      <text x="722" y="164">Plastic: film, tubs, yeast wraps</text>
      <rect x="696" y="180" width="18" height="18" fill="#7a7a7a"/>
      <text x="722" y="194">Metal: tins, foil trays</text>
      <rect x="696" y="210" width="18" height="18" fill="#7a4a8a"/>
      <text x="722" y="224">Glass: jars, bottles</text>
      <rect x="696" y="240" width="18" height="18" fill="#8a5a2a"/>
      <text x="722" y="254">Wood: pallets, crates</text>
      <rect x="696" y="270" width="18" height="18" fill="#c06080"/>
      <text x="722" y="284">Textiles (since 2025)</text>
      <text x="696" y="318" font-weight="bold">Small bakery on the municipal</text>
      <text x="696" y="336" font-weight="bold">collection, under 1,100 L/week:</text>
      <text x="696" y="354">follow the commune's sorting rules</text>
      <text x="696" y="382">Hazardous (danger pictograms):</text>
      <text x="696" y="400">as the label and house rules say</text>
    </g>

    <!-- bottom note -->
    <rect x="30" y="540" width="910" height="44" fill="#eef7f1" stroke="#cccccc"/>
    <text x="485" y="567" text-anchor="middle" font-size="14">Mouldy, dropped or returned bread never goes back into food or a donation: it goes to level 4. Allergens follow the bread.</text>
  </g>
</svg>
